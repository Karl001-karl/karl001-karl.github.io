<!DOCTYPE html> <html lang='zh-CN'> <head> <meta charset='utf-8'> <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'> <meta name='apple-mobile-web-app-capable' content='yes'> <meta name='mobile-web-app-capable' content='yes'> <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'> <title>Living 激活码生成器</title> <style> :root{ --bg:#0b0f16; --panel:#141a24; --line:#232c3a; --fg:#e9edf5; --dim:#8a93a5; --acc:#4d7cff; --ok:#2ecc71; --bad:#ff5c5c; } *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Roboto,sans-serif; } body{ padding:16px 14px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; } h1{ font-size:19px; margin:0 0 2px; letter-spacing:.5px; } .sub{ font-size:12px; color:var(--dim); margin:0 0 14px; } .warn{ display:inline-block; font-size:11px; color:#ff9b9b; background:#2a1416; border:1px solid #44201f; border-radius:6px; padding:2px 8px; margin-bottom:16px; } .card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; } .label{ font-size:13px; color:var(--dim); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; } .label b{ color:var(--fg); font-weight:600; font-size:13px; } input[type=text],input[type=number],input[type=password]{ width:100%; background:#0e131c; color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:14px 12px; font-size:17px; letter-spacing:1px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; outline:none; } input:focus{ border-color:var(--acc); } .hint{ font-size:12px; color:var(--dim); margin-top:8px; min-height:16px; } .hint.ok{ color:var(--ok); } .hint.bad{ color:var(--bad); } button{ width:100%; border:0; border-radius:12px; padding:16px; font-size:17px; font-weight:700; color:#fff; background:var(--acc); margin-top:12px; cursor:pointer; } button:active{ transform:scale(.985); filter:brightness(.92); } button.ghost{ background:#1d2634; font-weight:600; font-size:14px; padding:12px; margin-top:8px; color:var(--dim); } #out{ display:none; } .code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:24px; font-weight:800; letter-spacing:2px; text-align:center; color:#7fa6ff; word-break:break-all; line-height:1.5; user-select:all; -webkit-user-select:all; } .code.done{ color:var(--ok); } .tip{ font-size:12px; color:var(--dim); text-align:center; margin-top:10px; } .adv{ margin-top:10px; } .adv summary{ font-size:12px; color:var(--dim); cursor:pointer; } .adv input{ margin-top:10px; font-size:15px; padding:10px; } .badge{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); background:#12261a; color:var(--ok); border:1px solid #1e4a2e; border-radius:999px; padding:8px 16px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:9; } .badge.show{ opacity:1; } .badge.bad{ background:#2a1416; color:var(--bad); border-color:#44201f; } .foot{ font-size:11px; color:#525b6b; text-align:center; margin-top:18px; line-height:1.7; } .feats{ display:flex; flex-wrap:wrap; gap:8px; } .feat{ flex:1 1 44%; padding:13px 8px; border-radius:10px; background:#0e131c; border:1px solid var(--line); color:var(--dim); font-size:14px; text-align:center; cursor:pointer; user-select:none; -webkit-user-select:none; } .feat.on{ background:#14274d; border-color:var(--acc); color:#cfe0ff; font-weight:700; } .frow{ display:flex; gap:8px; margin-top:10px; } .mini{ width:auto; flex:1; padding:11px; font-size:13px; font-weight:600; background:#1d2634; color:var(--dim); margin:0; } #gate{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; z-index:20; } .gwrap{ width:100%; max-width:360px; text-align:center; } .gwrap h2{ font-size:17px; margin:0 0 6px; letter-spacing:.5px; } .gwrap p{ font-size:12px; color:var(--dim); margin:0 0 16px; } .gwrap input{ text-align:center; letter-spacing:2px; } </style> </head> <body> <div id='gate'> <div class='gwrap'> <h2>需要密码</h2> <p>输入密码后使用</p> <input id='gpwd' type='password' autocomplete='off' placeholder='密码'> <button id='gok'>进入</button> <div class='hint' id='ghint'></div> </div> </div> <div id='app' style='display:none'> <h1>Living 激活码生成器</h1> <p class='sub'>粘贴客户机器码 → 生成激活码 → 复制发给客户</p> <span class='warn'>卖家专用 · 请勿外发</span> <div class='card'> <div class='label'><b>① 客户机器码</b><span>4 段 · 16 位</span></div> <input id='mc' type='text' autocomplete='off' autocorrect='off' autocapitalize='characters' spellcheck='false' placeholder='例：9063-6A21-1693-EB32'> <div class='hint' id='mcHint'>粘贴或输入上面的机器码</div> </div> <div class='card'> <div class='label'><b>② 开通哪些付费功能</b><span>不勾 = 基础版</span></div> <div class='feats' id='feats'></div> <div class='frow'> <button class='mini' id='fAll'>全开</button> <button class='mini' id='fNone'>全清</button> </div> </div> <div class='card'> <div class='label'><b>③ 生成激活码</b><span id='saltTag'>salt 0</span></div> <button id='gen'>生成激活码</button> <details class='adv'> <summary>高级：指定 salt（一般不用改，默认 0）</summary> <input id='salt' type='number' value='0' min='0' max='127' inputmode='numeric'> </details> <div id='out'> <div class='code' id='code' style='margin-top:14px'></div> <div class='tip' id='featTxt'></div> <div class='tip' id='tipTxt'>点一下上面的激活码即可复制</div> </div> </div> <div class='card'> <div class='label'><b>④ 算法自检</b><span id='chkTag'>检测中…</span></div> <div class='hint' id='chkHint'>页面会自动核对 7 组标准样本，全对才说明码准。</div> </div> <div class='foot'> 离线可用 · 不联网 · 不记录任何机器码<br> 打开一次后，浏览器菜单里选「添加到主屏幕」，以后像 App 一样点开 </div> <div class='badge' id='toast'>已复制</div> </div><!-- /app --> <script> var B32A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; var SHA_K = [ 0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5, 0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174, 0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da, 0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967, 0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85, 0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070, 0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3, 0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]; function rotr(x,n){ return (x>>>n)|(x<<(32-n)); } function sha256(bytes){ var l = bytes.length; var total = (((l+8)>>6)+1)<<6; var buf = new Uint8Array(total); buf.set(bytes,0); buf[l] = 0x80; var bl = l*8; buf[total-4] = (bl>>>24)&255; buf[total-3] = (bl>>>16)&255; buf[total-2] = (bl>>>8)&255; buf[total-1] = bl&255; var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; var w = new Uint32Array(64); for(var i=0;i<total;i+=64){ for(var t=0;t<16;t++){ w[t] = ((buf[i+t*4]<<24)|(buf[i+t*4+1]<<16)|(buf[i+t*4+2]<<8)|buf[i+t*4+3])>>>0; } for(var t=16;t<64;t++){ var s0 = (rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3))>>>0; var s1 = (rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10))>>>0; w[t] = (w[t-16]+s0+w[t-7]+s1)>>>0; } var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7]; for(var t=0;t<64;t++){ var S1 = (rotr(e,6)^rotr(e,11)^rotr(e,25))>>>0; var ch = ((e&f)^((~e)&g))>>>0; var t1 = (h+S1+ch+SHA_K[t]+w[t])>>>0; var S0 = (rotr(a,2)^rotr(a,13)^rotr(a,22))>>>0; var mj = ((a&b)^(a&c)^(b&c))>>>0; var t2 = (S0+mj)>>>0; h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0; } H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0; H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0; } var out = new Uint8Array(32); for(var i2=0;i2<8;i2++){ out[i2*4]   = (H[i2]>>>24)&255; out[i2*4+1] = (H[i2]>>>16)&255; out[i2*4+2] = (H[i2]>>>8)&255; out[i2*4+3] = H[i2]&255; } return out; } function toBytes(str){ var b = new Uint8Array(str.length); for(var i=0;i<str.length;i++){ b[i] = str.charCodeAt(i)&255; } return b; } function hmacSha256(keyBytes, msgBytes){ var K = new Uint8Array(64); if(keyBytes.length > 64){ K.set(sha256(keyBytes),0); } else { K.set(keyBytes,0); } var ip = new Uint8Array(64), op = new Uint8Array(64); for(var i=0;i<64;i++){ ip[i] = K[i]^0x36; op[i] = K[i]^0x5c; } var inner = new Uint8Array(64+msgBytes.length); inner.set(ip,0); inner.set(msgBytes,64); var ih = sha256(inner); var outer = new Uint8Array(64+32); outer.set(op,0); outer.set(ih,64); return sha256(outer); } function b32first10(bytes){ var bits = 0, val = 0, out = ''; for(var i=0;i<10;i++){ val = ((val<<8) | bytes[i]) & 0x1fff; bits += 8; while(bits >= 5){ out += B32A[(val >>> (bits-5)) & 31]; bits -= 5; } } return out; } var _KD = [22,19,12,19,20,29,119,17,27,8,22,119,104,106,104,108, 119,27,25,14,19,12,27,14,19,21,20,119,9,31,25,8, 31,14,119,44,107]; var _KX = 90; var SECRET = (function(){ var s = ''; for(var i=0;i<_KD.length;i++){ s += String.fromCharCode(_KD[i] ^ _KX); } return s; })(); var FEAT_ORDER = ['live','prompter','avoid','kiosk']; var FEAT_NAMES = { live:'实时输出', prompter:'提词器', avoid:'舞台避让', kiosk:'点歌大屏' }; function normalizeMachine(text){ var raw = String(text||'').toUpperCase().replace(/[^0-9A-Z]/g,''); return raw; } function featTag(feats){ if(!feats || !feats.length) return ''; var bits = ''; for(var i=0;i<FEAT_ORDER.length;i++){ bits += (feats.indexOf(FEAT_ORDER[i]) >= 0 ? '1' : '0'); } return bits.indexOf('1') >= 0 ? ('F' + bits) : ''; } function makeActivation(machine, salt, feats){ var m = normalizeMachine(machine); if(!m) return ''; var grouped = m.replace(/([0-9A-Za-z]{4})/g, function(a,b,c){ return (c? '-':'') + b; }); var msg = grouped + '|' + String(parseInt(salt||0,10) || 0); var tag = featTag(feats); if(tag){ msg += '|' + tag; } var dig = hmacSha256(toBytes(SECRET), toBytes(msg)); var raw = b32first10(dig).substring(0,16); return raw.substring(0,4)+'-'+raw.substring(4,8)+'-'+raw.substring(8,12)+'-'+raw.substring(12,16); } var $mc = document.getElementById('mc'); var $hint = document.getElementById('mcHint'); var $gen = document.getElementById('gen'); var $out = document.getElementById('out'); var $code = document.getElementById('code'); var $tip = document.getElementById('tipTxt'); var $salt = document.getElementById('salt'); var $saltTag = document.getElementById('saltTag'); var $toast = document.getElementById('toast'); function fmtGroups(raw){ return raw.replace(/(.{4})/g,'$1-').replace(/-$/,''); } function refreshHint(){ var raw = normalizeMachine($mc.value); if(!raw){ $hint.className='hint'; $hint.textContent='粘贴或输入上面的机器码'; return ''; } if(!/^[0-9A-F]{16}$/.test(raw)){ $hint.className='hint bad'; $hint.textContent = '这串是 ' + raw.length + ' 位，机器码应为 16 位十六进制（只有 0-9 和 A-F），请核对'; return raw; } $hint.className='hint ok'; $hint.textContent = '已识别：' + fmtGroups(raw) + '（16 位 ✓）'; return raw; } $mc.addEventListener('input', function(){ refreshHint(); $out.style.display = 'none'; }); $salt.addEventListener('input', function(){ $saltTag.textContent = 'salt ' + (parseInt($salt.value||'0',10)||0); }); function toast(msg, bad){ $toast.textContent = msg; $toast.className = 'badge show' + (bad ? ' bad' : ''); clearTimeout(toast._t); toast._t = setTimeout(function(){ $toast.className = 'badge'; }, 1600); } var FEAT_ON = {}; (function(){ var box = document.getElementById('feats'); for(var i=0;i<FEAT_ORDER.length;i++){ (function(key){ var el = document.createElement('div'); el.className = 'feat'; el.textContent = FEAT_NAMES[key]; el.addEventListener('click', function(){ FEAT_ON[key] = !FEAT_ON[key]; el.className = 'feat' + (FEAT_ON[key] ? ' on' : ''); $out.style.display = 'none'; }); box.appendChild(el); })(FEAT_ORDER[i]); } document.getElementById('fAll').addEventListener('click', function(){ FEAT_ORDER.forEach(function(k){ FEAT_ON[k] = true; }); syncFeatUI(); }); document.getElementById('fNone').addEventListener('click', function(){ FEAT_ORDER.forEach(function(k){ FEAT_ON[k] = false; }); syncFeatUI(); }); })(); function syncFeatUI(){ var box = document.getElementById('feats'); for(var i=0;i<box.children.length;i++){ var k = FEAT_ORDER[i]; box.children[i].className = 'feat' + (FEAT_ON[k] ? ' on' : ''); } $out.style.display = 'none'; } function getFeats(){ var out = []; for(var i=0;i<FEAT_ORDER.length;i++){ if(FEAT_ON[FEAT_ORDER[i]]) out.push(FEAT_ORDER[i]); } return out; } $gen.addEventListener('click', function(){ var raw = refreshHint(); if(!raw) { toast('请先填机器码', true); return; } if(!/^[0-9A-F]{16}$/.test(raw)) { toast('机器码位数不对', true); return; } var salt = parseInt($salt.value||'0',10)||0; if(salt<0 || salt>127) { toast('salt 只能是 0~127', true); return; } var feats = getFeats(); var code = makeActivation(raw, salt, feats); $code.textContent = code; $code.className = 'code'; $out.style.display = 'block'; document.getElementById('featTxt').textContent = feats.length ? ('已带功能：' + feats.map(function(k){ return FEAT_NAMES[k]; }).join(' / ') + '（客户激活即开通）') : '基础版：不含付费功能（要开通请在上方点选）'; $tip.textContent = '点一下上面的激活码即可复制'; try { $code.scrollIntoView({behavior:'smooth', block:'center'}); } catch(e){} }); $code.addEventListener('click', function(){ var t = $code.textContent; if(!t) return; copyText(t); }); function copyText(t){ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ done(); }, function(){ fallback(t); }); } else { fallback(t); } function done(){ $tip.textContent='已复制，粘到微信发给客户'; $code.className='code done'; setTimeout(function(){ $code.className='code'; }, 900); toast('已复制'); } function fallback(t){ var ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败，请长按文字手动复制', true); } document.body.removeChild(ta); } } var SAMPLES = [ ['9063-6A21-1693-EB32', 0,   [],                                 'LYGP-63BR-BOK2-OCCH'], ['9063-6A21-1693-EB32', 0,   ['live'],                           'FCCC-OLJL-O4ZL-XFXB'], ['9063-6A21-1693-EB32', 0,   ['prompter'],                       '3ADI-DG4X-2FDD-VBW3'], ['9063-6A21-1693-EB32', 0,   ['avoid','kiosk'],                  'J2RD-PTRA-FM76-7T6S'], ['9063-6A21-1693-EB32', 0,   ['live','prompter','avoid','kiosk'],'FQXH-5I4B-KHRW-MEJS'], ['9063-6A21-1693-EB32', 5,   ['live','prompter','avoid','kiosk'],'AQ3U-QOJ4-2MOK-N4CY'], ['9063-6A21-1693-EB32', 127, ['live'],                           'RM4G-LSJZ-WZUT-L67W'] ]; (function(){ var ok = 0, rows = []; for(var i=0;i<SAMPLES.length;i++){ var s = SAMPLES[i]; var got = makeActivation(s[0], s[1], s[2]); var pass = (got === s[3]); if(pass) ok++; rows.push((pass?'✓ ':'✗ ') + s[0] + ' salt' + s[1] + ' [' + (s[2].length?s[2].join(','):'无功能') + '] → ' + got); } var tag = document.getElementById('chkTag'); var hint = document.getElementById('chkHint'); if(ok === SAMPLES.length){ tag.textContent = '通过 ' + ok + '/' + SAMPLES.length; tag.style.color = '#2ecc71'; hint.className = 'hint ok'; hint.textContent = '算法自检通过，生成的码和 Living 认的是同一套。'; } else { tag.textContent = '异常 ' + ok + '/' + SAMPLES.length; tag.style.color = '#ff5c5c'; hint.className = 'hint bad'; hint.textContent = '自检没通过，别发码！把下面内容截图发我：；' + rows.join('；'); } })(); var GATE_HASH = '6fddc5a4e937e3b4b35ffe1934f4c3fe5c138ce8d33e4e47a66c93b3ff2dba13'; function sha256hex(s){ var b = sha256(toBytes(s)), out = ''; for(var i=0;i<b.length;i++){ out += ('0'+b[i].toString(16)).slice(-2); } return out; } function openApp(){ var g = document.getElementById('gate'); if(g) g.style.display = 'none'; document.getElementById('app').style.display = 'block'; } function tryGate(){ var v = (document.getElementById('gpwd').value || '').trim(); if(!v) return; if(sha256hex('gate:' + v) === GATE_HASH){ try { localStorage.setItem('lv_gate','1'); } catch(e){} openApp(); } else { var h = document.getElementById('ghint'); h.className = 'hint bad'; h.textContent = '密码不对'; document.getElementById('gpwd').value = ''; } } document.getElementById('gok').addEventListener('click', tryGate); document.getElementById('gpwd').addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.keyCode === 13){ tryGate(); } }); (function(){ var ok = false; try { ok = localStorage.getItem('lv_gate') === '1'; } catch(e){} if(ok){ openApp(); } })(); </script> </body> </html>
